<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Organic Shop</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@700&amp;family=Roboto:wght@400;500;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,100..900;1,100..900&family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/main.css" />
  </head>

  <body>
    <header></header>

    <main>
      <!-- Hero -->
      <section class="hero">
        <div class="container">
          <h1 class="hero-title">Organic Shop - Naturally better.</h1>
          <p class="hero-text">
            Your source for fresh, healthy, and responsibly grown food. Discover
            the taste of nature with our carefully selected organic products.
          </p>
          <button class="hero-button" type="button" onclick="location.href='#contacts'">Get in touch</button>
        </div>
      </section>

      <!-- Mission -->
      <section class="mission"></section>

      <!-- Benefits -->
      <section class="benefits"></section>

      <!-- Assortment -->
      <section class="assortment"></section>

      <!-- Feedbacks -->
      <section class="feedbacks"></section>

      <!-- FAQs -->
      <section class="faqs"></section>

      <!-- Contacts -->
      <section class="contacts"></section>
    </main>

    <footer></footer>
  </body>
</html>
