<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Organic Shop</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@700&amp;family=Roboto:wght@400;500;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/header.css" />
  </head>

  <body>
    <header class="header">
      <div class="header-container">
        <!-- LOGO -->

        <a href="./index.html" class="logo" aria-label="Organic Shop home page">
          <svg class="logo-icon" width="142" height="60">
            <use href="./images/icons.svg#CompanyLogo"></use>
          </svg>
        </a>

        <!-- DESKTOP NAVIGATION -->

        <div class="header-right">
          <nav class="desktop-nav" aria-label="Main navigation">
            <ul class="desktop-nav-list">
              <li><a href="#home">Home</a></li>
              <li><a href="#mission">Mission</a></li>
              <li><a href="#benefits">Benefits</a></li>
              <li><a href="#assortment">Assortment</a></li>
              <li><a href="#feedbacks">Feedbacks</a></li>
              <li><a href="#faq">FAQ</a></li>
              <li><a href="#contacts">Contacts</a></li>
            </ul>
          </nav>

          <a href="#assortment" class="order-btn">Order</a>
        </div>

        <!-- TABLET + MOBILE -->

        <div class="mobile-controls">
          <a href="#assortment" class="order-btn mobile-order-btn"> Order </a>

          <button class="menu-btn" type="button" aria-label="Open menu">
            <svg width="24" height="24">
              <use href="./images/icons.svg#menu"></use>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- BURGER MENU -->

    <!--
  Для відкриття меню:
  class="mobile-menu is-open"

  Для закриття:
  class="mobile-menu"
  -->

    <div class="mobile-menu">
      <div class="mobile-menu-container">
        <div class="mobile-menu-top">
          <a
            href="./index.html"
            class="logo"
            aria-label="Organic Shop home page"
          >
            <svg class="logo-icon" width="142" height="60">
              <use href="./images/icons.svg#CompanyLogo"></use>
            </svg>
          </a>

          <button class="close-btn" type="button" aria-label="Close menu">
            <svg width="24" height="24">
              <use href="./images/icons.svg#close"></use>
            </svg>
          </button>
        </div>

        <nav class="mobile-nav" aria-label="Mobile navigation">
          <ul class="mobile-nav-list">
            <li>
              <a href="#home">Home</a>
            </li>

            <li>
              <a href="#mission">Mission</a>
            </li>

            <li>
              <a href="#benefits">Benefits</a>
            </li>

            <li>
              <a href="#assortment">Assortment</a>
            </li>

            <li>
              <a href="#feedbacks">Feedbacks</a>
            </li>

            <li>
              <a href="#faq">FAQ</a>
            </li>

            <li>
              <a href="#contacts">Contacts</a>
            </li>
          </ul>
        </nav>

        <a href="#assortment" class="order-btn mobile-menu-order-btn">
          Order
        </a>
      </div>
    </div>

    <main>
      <!-- Hero -->
      <section class="hero"></section>

      <!-- Mission -->
      <section class="mission"></section>

      <!-- Benefits -->
      <section class="benefits"></section>

      <!-- Assortment -->
      <section class="assortment"></section>

      <!-- Feedbacks -->
      <section class="feedbacks"></section>

      <!-- FAQs -->
      <section class="faqs"></section>

      <!-- Contacts -->
      <section class="contacts"></section>
    </main>

    <footer></footer>
  </body>
</html>
